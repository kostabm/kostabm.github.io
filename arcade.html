<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kosta's Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0b0d17;color:#eef0ff;font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden}
  #menu{position:fixed;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:48px 16px 32px}
  h1{font-size:clamp(34px,7vw,64px);letter-spacing:-.04em;line-height:1;text-align:center}
  h1 span{background:linear-gradient(90deg,#7cf5c4,#8b7bff,#ff7ab6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:#9aa0c3;margin:10px 0 32px;font-size:15px;text-align:center}
  .games{width:100%;max-width:900px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .card{all:unset;cursor:pointer;display:block;border-radius:18px;overflow:hidden;background:#141830;border:1px solid rgba(255,255,255,.08);transition:transform .2s,border-color .2s}
  .card:hover,.card:focus-visible{transform:translateY(-4px);border-color:rgba(255,255,255,.3)}
  .thumb{height:120px;display:flex;align-items:center;justify-content:center;font-size:56px}
  .info{padding:12px 14px}.info b{font-size:17px}.info p{color:#9aa0c3;font-size:13px;margin-top:4px;line-height:1.35}
  .play{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;color:#7cf5c4}
  .blankbtn{margin-top:28px;font:700 15px 'Space Grotesk',system-ui,sans-serif;color:#0b0d17;background:#7cf5c4;border:0;border-radius:14px;padding:12px 20px;cursor:pointer}
  .blankbtn:hover{filter:brightness(1.08)}
  #stage{position:fixed;inset:0;display:none;background:#000}
  #stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  #bar{position:absolute;top:calc(4px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:2;opacity:1;transition:opacity .6s}
  #bar.dim{opacity:.12}
  #bar:hover,#bar:focus-within{opacity:1}
  #bar button{font:700 13px 'Space Grotesk',system-ui,sans-serif;color:#fff;background:rgba(11,13,23,.75);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:6px 12px;cursor:pointer}
  #bar button:hover{background:rgba(40,44,70,.9)}
</style>
</head>
<body>
<div id="menu">
  <h1><span>Kosta's Arcade</span></h1>
  <div class="sub">All my games in one place. Pick one to play.</div>
  <div class="games" id="games"></div>
  <button id="blank" class="blankbtn">🗔 Open in an about:blank tab</button>
</div>
<div id="stage">
  <div id="bar"><button id="back">◀ All games</button><button id="full">⛶ Full screen</button></div>
</div>
<script>
const GAMES=[
  {file:'powder.html',name:'Powder Peak',emoji:'🏂',bg:'linear-gradient(135deg,#e8f1fb,#7fb0e8 55%,#2f5fa8)',desc:'Ski or snowboard down a whole mountain. Kickers, flips, spins, grabs.'},
  {file:'drift.html',name:'Drift King',emoji:'🏎️',bg:'linear-gradient(135deg,#f6b373,#e8678a 50%,#3a2f6b)',desc:'Drift through a 3D city at sunset. 2 minutes, biggest score wins.'},
  {file:'sky.html',name:'Sky Takeover',emoji:'✈️',bg:'linear-gradient(135deg,#7cc8ff,#3a8fd6 55%,#1f4f7a)',desc:'Storm the cockpit and fly an airliner over Lake Tahoe.'},
  {file:'undead.html',name:'Undead Siege',emoji:'🧟',bg:'linear-gradient(135deg,#2a1f4d,#8a2a45 55%,#0b0912)',desc:'Survive zombie hordes. Loot chests, earn gold, upgrade.'}
];
const menu=document.getElementById('menu'),stage=document.getElementById('stage'),list=document.getElementById('games');
let frame=null;
for(const g of GAMES){
  const b=document.createElement('button');b.className='card';
  b.innerHTML=`<div class="thumb" style="background:${g.bg}">${g.emoji}</div><div class="info"><b>${g.name}</b><p>${g.desc}</p><span class="play">▶ Play</span></div>`;
  b.onclick=()=>openGame(g);list.appendChild(b);
}
function openGame(g){
  frame=document.createElement('iframe');
  frame.src=g.file;frame.title=g.name;
  frame.allow='fullscreen; autoplay; gamepad; accelerometer; gyroscope';
  frame.allowFullscreen=true;
  frame.onload=()=>{try{frame.focus();}catch(e){}};
  stage.appendChild(frame);
  menu.style.display='none';stage.style.display='block';
  const bar=document.getElementById('bar');bar.classList.remove('dim');clearTimeout(window._dimT);window._dimT=setTimeout(()=>bar.classList.add('dim'),3500);
  history.pushState({g:g.file},'' ,'#'+g.file.replace('.html',''));
}
function closeGame(){
  if(frame){frame.remove();frame=null;}
  stage.style.display='none';menu.style.display='flex';
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
}
document.getElementById('back').onclick=()=>{if(history.state&&history.state.g)history.back();else closeGame();};
document.getElementById('full').onclick=()=>{
  const el=document.documentElement;
  if(document.fullscreenElement)document.exitFullscreen();
  else if(el.requestFullscreen)el.requestFullscreen().catch(()=>window.open(frame?frame.src:location.href,'_blank'));
  else window.open(frame?frame.src:location.href,'_blank');
};
// open the whole arcade inside an about:blank tab
const blankBtn=document.getElementById('blank');
if(window.top!==window)blankBtn.style.display='none';
blankBtn.onclick=()=>{
  const w=window.open('about:blank','_blank');
  if(!w){alert('Your browser blocked the new tab. Allow pop-ups for this site and try again.');return;}
  const url=new URL('arcade.html',location.href).href;
  w.document.title='about:blank';
  const st=w.document.createElement('style');st.textContent='html,body{margin:0;height:100%;overflow:hidden;background:#0b0d17}iframe{border:0;width:100%;height:100%;display:block}';
  w.document.head.appendChild(st);
  const f=w.document.createElement('iframe');f.src=url;f.allow='fullscreen; autoplay; gamepad; accelerometer; gyroscope';f.allowFullscreen=true;
  w.document.body.appendChild(f);
};
addEventListener('popstate',e=>{if(!(e.state&&e.state.g))closeGame();});
// open straight into a game with a link like arcade.html#powder
const start=GAMES.find(g=>'#'+g.file.replace('.html','')===location.hash);
if(start){history.replaceState(null,"",location.pathname);openGame(start);}
</script>
</body>
</html>
