<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kosta's Games</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Space Grotesk',system-ui,sans-serif;background:#0b0d17;color:#eef0ff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:80px 24px 40px}
  h1{font-size:clamp(40px,8vw,80px);letter-spacing:-.04em;line-height:1;text-align:center}
  h1 span{background:linear-gradient(90deg,#7cf5c4,#8b7bff,#ff7ab6);-webkit-background-clip:text;background-clip:text;color:transparent}
  h2{font-size:14px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:#9aa0c3;margin:80px 0 20px}
  .games{width:100%;max-width:900px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .empty{grid-column:1/-1;border:2px dashed rgba(255,255,255,.12);border-radius:18px;padding:60px 20px;text-align:center;color:#9aa0c3}
  .empty div{font-size:36px;margin-bottom:10px}
  .card{display:block;text-decoration:none;color:inherit;border-radius:18px;overflow:hidden;background:#141830;border:1px solid rgba(255,255,255,.08);transition:transform .2s,border-color .2s}
  .card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.25)}
  .thumb{height:140px;display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,#f6b373,#e8678a 50%,#3a2f6b)}
  .info{padding:14px 16px}.info b{font-size:18px}.info p{color:#9aa0c3;font-size:14px;margin-top:4px}
  .stock{width:100%;max-width:900px;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
  footer{margin-top:auto;padding-top:80px;color:#5d6288;font-size:13px}
</style>
</head>
<body>
  <h1><span>Kosta's Games</span></h1>
  <h2>Games</h2>
  <div class="games">
    <a class="card" href="drift.html"><div class="thumb">🏎️</div><div class="info"><b>Drift King</b><p>Drift through a 3D city at sunset. 2 minutes, biggest score wins.</p></div></a>
    <a class="card" href="undead.html"><div class="thumb" style="background:linear-gradient(135deg,#2a1f4d,#8a2a45 55%,#0b0912)">🧟</div><div class="info"><b>Undead Siege</b><p>Survive zombie hordes in an open world or endless waves. Loot chests, earn gold, upgrade.</p></div></a>
  </div>
  <h2>Anthropic (ANT)</h2>
  <div class="stock">
    <!-- Anthropic (ANT) stock chart -->
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
      {
        "symbol": "NASDAQ:ANT",
        "width": "100%",
        "height": 220,
        "locale": "en",
        "dateRange": "1D",
        "colorTheme": "light",
        "isTransparent": false,
        "autosize": false
      }
      </script>
    </div>
  </div>
  <footer>Kosta's Games</footer>
</body>
</html>
